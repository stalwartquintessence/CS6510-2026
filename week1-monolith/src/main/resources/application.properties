# ---------------------------------------------------------------------------
# Self-Checkout — Week 1 Layered Monolith
# ---------------------------------------------------------------------------
spring.application.name=week1-monolith
server.port=8080

# --- Datasource (PostgreSQL via docker-compose) ----------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/supermarket
spring.datasource.username=supermarket
spring.datasource.password=supermarket
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool sized for 100+ concurrent checkout stations. The pool is the
# real concurrency ceiling of this monolith: completion holds a PESSIMISTIC
# row lock per SKU, so contention on hot (Zipf-weighted) SKUs shows up here.
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=10000

# --- JPA / Hibernate -------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# spring.jpa.show-sql=false

# --- Web container ---------------------------------------------------------
server.tomcat.threads.max=200
server.tomcat.accept-count=200

# --- Catalog seeding defaults (mirror mockserver reference) ----------------
supermarket.catalog.size=2000
supermarket.catalog.stock-per-item=10000
supermarket.inventory.low-stock-threshold=50

# --- Analytics hopping window ----------------------------------------------
supermarket.analytics.window-size=1000
supermarket.analytics.slide-interval=500
