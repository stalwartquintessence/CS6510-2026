# ---------------------------------------------------------------------------
# Self-Checkout — Week 3 Pipeline Architecture
#
# Deliberately identical to week 2 apart from the app name and the datasource
# port. The only change this week is that the popular-items analytics runs as
# a pipeline of threaded filters instead of on the request thread, so holding
# the runtime tuning constant keeps the p95/p99 comparison attributable to
# that change rather than to configuration drift.
# ---------------------------------------------------------------------------
spring.application.name=week3-pipeline
server.port=8080

# --- Datasource (PostgreSQL via docker-compose) ----------------------------
# Port 5434 so week 1 (5432) and week 2 (5433) can stay running alongside this one.
spring.datasource.url=jdbc:postgresql://localhost:5434/supermarket
spring.datasource.username=supermarket
spring.datasource.password=supermarket
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool sized for 100+ concurrent checkout stations. The pool is the
# real concurrency ceiling of this implementation: completion holds a
# PESSIMISTIC row lock per SKU, so contention on hot (Zipf-weighted) SKUs shows
# up here.
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=10000

# --- JPA / Hibernate -------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Web container ---------------------------------------------------------
server.tomcat.threads.max=200
server.tomcat.accept-count=200

# --- Catalog seeding defaults (mirror mockserver reference) ----------------
supermarket.catalog.size=2000
supermarket.catalog.stock-per-item=10000
supermarket.inventory.low-stock-threshold=50

# --- Analytics hopping window ----------------------------------------------
supermarket.analytics.window-size=1000
supermarket.analytics.slide-interval=500
