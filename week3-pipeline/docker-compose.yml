services:
  postgres:
    image: postgres:16
    container_name: supermarket-pg-week3
    environment:
      POSTGRES_DB: supermarket
      POSTGRES_USER: supermarket
      POSTGRES_PASSWORD: supermarket
    # Host port 5434 so week 1 (5432) and week 2 (5433) can stay up alongside this one.
    ports:
      - "5434:5432"
    volumes:
      - supermarket-pgdata-week3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supermarket -d supermarket"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  supermarket-pgdata-week3:
