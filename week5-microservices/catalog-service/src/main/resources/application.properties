spring.application.name=catalog-service
# Pure gRPC service: no embedded web server.
spring.main.web-application-type=none
supermarket.grpc.port=9101
supermarket.grpc.threads=16

# --- This service's own database ---------------------------------------------
# catalog-db (docker-compose, host port 5436). No other service has these credentials;
# the schema is db/catalog.sql, applied by PostgreSQL on first start.
spring.datasource.url=jdbc:postgresql://localhost:5436/catalog
spring.datasource.username=catalog
spring.datasource.password=catalog
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# Catalog seeding default (mirrors the mockserver reference). Stock is the inventory service's.
supermarket.catalog.size=2000
