spring.application.name=transaction-service
# Pure gRPC service: no embedded web server.
spring.main.web-application-type=none
supermarket.grpc.port=9102
supermarket.grpc.threads=200

# --- This service's own database ---------------------------------------------
# transaction-db (docker-compose, host port 5437). No other service has these credentials;
# the schema is db/transaction.sql, applied by PostgreSQL on first start.
spring.datasource.url=jdbc:postgresql://localhost:5437/transaction
spring.datasource.username=transaction
spring.datasource.password=transaction
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=10000

# 50 connections and 200 request threads are the constants held since week 1. The stock row
# locks have moved to the inventory service (which gets the same 200/50 on its own database);
# what is left here is the basket rows, the outbox and the saga's state changes.

# --- The services this one calls ---------------------------------------------
supermarket.rpc.catalog=localhost:9101
supermarket.rpc.inventory=localhost:9103
supermarket.rpc.channels-per-service=4
supermarket.rpc.catalog-deadline=2s

# --- The checkout saga (see CheckoutSaga) --------------------------------------
# The stock step must fail inside the gateway's 10 s deadline, so the client hears why.
supermarket.saga.deduct-deadline=9s
supermarket.saga.restore-deadline=5s
# Well past the deduct deadline, so recovery never races a request still in flight.
supermarket.saga.stuck-after=30s
supermarket.saga.recovery-interval=5s
