spring.application.name=inventory-service
# Pure gRPC service: no embedded web server.
spring.main.web-application-type=none
supermarket.grpc.port=9103
# Week 5: this service now holds the hot row locks (the saga's DeductStock), so it gets the
# 200 worker threads and 50 connections held constant since week 1 — on its own database.
supermarket.grpc.threads=200

# --- This service's own database ---------------------------------------------
# inventory-db (docker-compose, host port 5438). No other service has these credentials;
# the schema is db/inventory.sql, applied by PostgreSQL on first start.
spring.datasource.url=jdbc:postgresql://localhost:5438/inventory
spring.datasource.username=inventory
spring.datasource.password=inventory
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=10000

supermarket.inventory.low-stock-threshold=50
# Units per SKU on first seed (was supermarket.catalog.stock-per-item in weeks 1-4).
supermarket.inventory.initial-stock=10000
supermarket.inventory.seed-timeout=2m
# The order a sale locks its stock rows in. SKU_ASCENDING is weeks 1-4's order and what every
# reported comparison uses; SKU_DESCENDING is the lock-order experiment (see LockOrder).
supermarket.inventory.lock-order=SKU_ASCENDING

# --- The one service this one calls ------------------------------------------
supermarket.rpc.catalog=localhost:9101
supermarket.rpc.deadline=10s
