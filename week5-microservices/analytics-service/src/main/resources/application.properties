spring.application.name=analytics-service
# Pure gRPC service: no embedded web server.
spring.main.web-application-type=none
supermarket.grpc.port=9104
supermarket.grpc.threads=16

# --- This service's own database ---------------------------------------------
# analytics-db (docker-compose, host port 5439). No other service has these credentials;
# the schema is db/analytics.sql, applied by PostgreSQL on first start.
spring.datasource.url=jdbc:postgresql://localhost:5439/analytics
spring.datasource.username=analytics
spring.datasource.password=analytics
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# Analytics hopping window (unchanged since week 1)
supermarket.analytics.window-size=1000
supermarket.analytics.slide-interval=500

# How the transaction service's scan feed is read (see ScanFeedSource)
supermarket.analytics.source.poll-interval=50ms
supermarket.analytics.source.settle-delay=250ms

# --- The services this one calls ---------------------------------------------
supermarket.rpc.transaction=localhost:9102
supermarket.rpc.catalog=localhost:9101
supermarket.rpc.deadline=5s
