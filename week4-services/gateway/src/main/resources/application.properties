# ---------------------------------------------------------------------------
# Self-Checkout — Week 4 gateway
#
# The only component with an HTTP port, and the only one the load client talks to. It has no
# datasource: every request is forwarded over gRPC to the domain service that owns it.
# Tomcat is held at the constants of weeks 1-3 (200 threads) so the front door is unchanged.
# ---------------------------------------------------------------------------
spring.application.name=gateway
server.port=8080
server.tomcat.threads.max=200
server.tomcat.accept-count=200

# --- Where the domain services live -----------------------------------------
supermarket.rpc.catalog=localhost:9101
supermarket.rpc.transaction=localhost:9102
supermarket.rpc.inventory=localhost:9103
supermarket.rpc.analytics=localhost:9104
supermarket.rpc.channels-per-service=4
supermarket.rpc.deadline=10s
