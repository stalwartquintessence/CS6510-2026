spring.application.name=analytics-service
# Pure gRPC service: no embedded web server.
spring.main.web-application-type=none
supermarket.grpc.port=9104
supermarket.grpc.threads=16

# --- Shared database -------------------------------------------------------
# One centralized PostgreSQL for the whole system (docker-compose, host port 5435).
# The schema is created once by db/init.sql, so no service creates or alters tables.
spring.datasource.url=jdbc:postgresql://localhost:5435/supermarket
spring.datasource.username=supermarket
spring.datasource.password=supermarket
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# Analytics hopping window (unchanged since week 1)
supermarket.analytics.window-size=1000
supermarket.analytics.slide-interval=500

# How the scan_log table is tailed (see ScanLogSource)
supermarket.analytics.source.poll-interval=50ms
supermarket.analytics.source.settle-delay=250ms
