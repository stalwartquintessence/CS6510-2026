// The service-to-service contracts. The public HTTP contract
// (spec/self-checkout-openapi.yaml) is untouched: the gateway is the only
// component that speaks it, and translates each call into one of these RPCs.
syntax = "proto3";

package supermarket.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.supermarket.contracts";
option java_outer_classname = "SupermarketProto";

// ---------------------------------------------------------------- catalog

service CatalogService {
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);
}

message ListItemsRequest {}

message CatalogItem {
  string sku = 1;
  string name = 2;
  double price = 3;
}

message ListItemsResponse {
  repeated CatalogItem items = 1;
}

// ------------------------------------------------------------ transaction

service TransactionService {
  rpc Start(StartRequest) returns (Basket);
  rpc Scan(ScanRequest) returns (ScanResult);
  rpc Complete(CompleteRequest) returns (Receipt);
  rpc GetStatus(GetStatusRequest) returns (Basket);
}

message StartRequest {
  string station_id = 1;
}

message ScanRequest {
  string transaction_id = 1;
  string sku = 2;
}

message CompleteRequest {
  string transaction_id = 1;
}

message GetStatusRequest {
  string transaction_id = 1;
}

message Basket {
  string transaction_id = 1;
  string station_id = 2;
  string status = 3;
  int32 item_count = 4;
  double running_total = 5;
  google.protobuf.Timestamp started_at = 6;
}

message ScanResult {
  string transaction_id = 1;
  string sku = 2;
  string name = 3;
  double unit_price = 4;
  int32 item_count = 5;
  double running_total = 6;
}

message ReceiptLine {
  string sku = 1;
  string name = 2;
  double unit_price = 3;
  int32 quantity = 4;
}

message Receipt {
  string transaction_id = 1;
  string station_id = 2;
  int32 item_count = 3;
  double total_amount = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp completed_at = 6;
  repeated ReceiptLine lines = 7;
}

// -------------------------------------------------------------- inventory

service InventoryService {
  rpc GetLowStock(LowStockRequest) returns (LowStockReport);
}

message LowStockRequest {
  // Absent means "the service's configured default".
  optional int32 threshold = 1;
}

message LowStockAlert {
  string sku = 1;
  string name = 2;
  int32 current_stock = 3;
  int32 threshold = 4;
}

message LowStockReport {
  int32 threshold = 1;
  google.protobuf.Timestamp generated_at = 2;
  repeated LowStockAlert alerts = 3;
}

// -------------------------------------------------------------- analytics

service AnalyticsService {
  rpc GetPopularItems(PopularItemsRequest) returns (PopularItemsReport);
}

message PopularItemsRequest {
  int32 limit = 1;
}

message PopularItem {
  string sku = 1;
  string name = 2;
  int32 scan_count = 3;
  int32 rank = 4;
}

message PopularItemsReport {
  int32 window_size = 1;
  int32 slide_interval = 2;
  int64 window_start = 3;
  int64 window_end = 4;
  google.protobuf.Timestamp computed_at = 5;
  repeated PopularItem items = 6;
}
