spring.application.name=transaction-service
# Pure gRPC service: no embedded web server.
spring.main.web-application-type=none
supermarket.grpc.port=9102
supermarket.grpc.threads=200

# --- Shared database -------------------------------------------------------
# One centralized PostgreSQL for the whole system (docker-compose, host port 5435).
# The schema is created once by db/init.sql, so no service creates or alters tables.
spring.datasource.url=jdbc:postgresql://localhost:5435/supermarket
spring.datasource.username=supermarket
spring.datasource.password=supermarket
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=10000

# The pool is the real concurrency ceiling here, exactly as in weeks 1-3: completion holds a
# PESSIMISTIC row lock per SKU, so contention on hot (Zipf-weighted) SKUs shows up as pool wait.
# 50 connections and 200 request threads are the constants held since week 1; they now live in
# the one service that does the work, instead of in the single monolith.
